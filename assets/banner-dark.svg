<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Ömer Savas – Full-stack developer from Cologne building web apps with Vue, Nuxt, React and TypeScript">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#f4f4f5" stroke-opacity="0.05"/>
    </pattern>
    <radialGradient id="glow" cx="78%" cy="30%" r="45%">
      <stop offset="0" stop-color="#bed7ac" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#bed7ac" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0.35" stop-color="#0a0a0c" stop-opacity="1"/>
      <stop offset="0.6" stop-color="#0a0a0c" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="320" rx="20"/></clipPath>
    <style>
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: 101px 75px; }
      @keyframes pulse { 0%,100% { opacity: .35; transform: scale(1); } 50% { opacity: 0; transform: scale(2.2); } }
      .float { animation: float 6s ease-in-out infinite; }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
      @media (prefers-reduced-motion: reduce) { .pulse, .float { animation: none; } }
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="#0a0a0c"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect width="1200" height="320" fill="url(#glow)"/>

